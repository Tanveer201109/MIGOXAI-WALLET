
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIGOXAI | SECURE AI HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --radium-green: #39ff14;
            --deep-green: #0f3d0e;
            --bg-dark: #05080a;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-dark);
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(10, 20, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(57, 255, 20, 0.15);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .radium-shadow {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }
        .radium-text {
            color: var(--radium-green);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .active-tab {
            background: linear-gradient(135deg, #0f3d0e 0%, #1a1a1a 100%);
            border: 1px solid var(--radium-green);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
            color: var(--radium-green) !important;
        }
        .smoke-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(5, 8, 10, 0.9) 100%);
            pointer-events: none;
            z-index: -1;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #1a4a1a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--radium-green); }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div class="smoke-overlay"></div>
    <div id="root"></div>
</body>
</html>
