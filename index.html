
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIGOXAI | SECURE QUANTUM NODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --radium-green: #39ff14;
            --deep-green: #0f3d0e;
            --smoke-black: #05080a;
            --glow-opacity: 0.4;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--smoke-black);
            color: #f0fdf4;
            overflow-x: hidden;
            margin: 0;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(57, 255, 20, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(15, 61, 14, 0.1) 0%, transparent 40%);
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Smoke Effect */
        .smoke-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(10, 15, 12, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(57, 255, 20, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }

        .radium-text {
            color: var(--radium-green);
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.6);
        }

        .radium-glow {
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
        }

        .radium-border {
            border-color: var(--radium-green);
        }

        .active-tab {
            background: linear-gradient(135deg, rgba(15, 61, 14, 0.9) 0%, rgba(5, 8, 10, 0.95) 100%);
            border: 1px solid var(--radium-green);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.4);
            color: var(--radium-green) !important;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline-effect {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(to bottom, transparent, var(--radium-green), transparent);
            opacity: 0.05;
            z-index: 100;
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--smoke-black); }
        ::-webkit-scrollbar-thumb { background: var(--deep-green); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--radium-green); }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="smoke-overlay"></div>
    <div class="scanline-effect"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
